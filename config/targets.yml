# Single source of truth for the food price stress study.
# Phase 2 definition. All scripts read this file.
version: "0.1.0"
seed: 42

# ---------------------------------------------------------------- unit & horizon
unit:
  keys: [market_id, commodity_id, currency]
  time_key: month
horizon_months: 1

# ---------------------------------------------------------------- price bases
price_bases:
  - name: nominal_within_currency   # B1
    value_column: price
    currency_scoped: true
  - name: usdprice                  # B2
    value_column: usdprice
    currency_scoped: false

# ---------------------------------------------------------------- categories
categories:
  include:
    - cereals and tubers
    - pulses and nuts
    - oil and fats
    - meat, fish and eggs
    - miscellaneous food
  exclude:
    - non-food

# ---------------------------------------------------------------- target 1
target_return_stress:
  name: y1_return_stress
  return_transform: log
  standardise: trailing
  trailing_window_months: 12
  min_prior_returns: 6
  threshold_sd: 1.0
  threshold_grid_sd: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]

# ---------------------------------------------------------------- target 2
target_peer_stress:
  name: y2_peer_stress
  peer_group: [commodity_id, currency, month]
  peer_stat: median
  min_peer_markets: 5
  min_peer_grid: [3, 5, 10]
  threshold_spi: 1.20
  threshold_grid_spi: [1.10, 1.20, 1.30, 1.50]

# ---------------------------------------------------------------- rainfall (CHIRPS)
rainfall:
  source: raw/yr.nc
  variable: precip
  spatial_agg: district_zonal_mean   # admin-2 polygons
  climatology_start: 1981-01
  climatology_end: 2015-12
  anomaly: z_score_by_district_calendar_month
  lags_months: [1, 2, 3]
  rolling_sum_months: [3]

# ---------------------------------------------------------------- dataset
panel:
  min_series_months_for_supervised: 6
  flag_priceflag_aggregate: true

# ---------------------------------------------------------------- validation
validation:
  scheme: expanding_window
  n_folds: 5
  holdout_months: 12           # final forward holdout
  # boundaries are recorded at runtime into artifacts/splits.json

# ---------------------------------------------------------------- tuning
# Optuna search is run ONLY on the training period (never the forward holdout).
# Objective = mean validation-block ROC-AUC across the expanding-window folds.
optuna:
  enabled: true
  n_trials: 40
  sampler_seed: 42
  models: [hist_gradient_boosting]   # models whose hyperparameters are tuned

